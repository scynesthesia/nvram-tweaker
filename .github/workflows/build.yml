name: Test and build

# Every push and pull request runs the tests and builds NVRAM_Tweaker.exe from
# this exact commit. Pushing a tag such as v1.1.0 also publishes a GitHub
# release with the exe and its SHA-256 checksum, so anyone can verify that a
# downloaded exe came from this workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/fetch_fonts.py
      - run: python -m PyInstaller --clean --noconfirm nvram_tweaker.spec
      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/NVRAM_Tweaker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NVRAM_Tweaker.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: NVRAM_Tweaker
          path: |
            dist/NVRAM_Tweaker.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: NVRAM_Tweaker
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/NVRAM_Tweaker.exe dist/SHA256SUMS.txt \
            --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
